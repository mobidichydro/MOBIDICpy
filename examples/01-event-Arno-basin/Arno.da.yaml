# Sequential data assimilation configuration for the Arno River Basin
# PESTPP-DA integration with MOBIDICpy


######## CASE SETTINGS

# OPTIONAL: File name prefix for PEST++ output files.
# [Any string. Default for pest_tool=da: "assimilation"]
case_name: assimilation

# REQUIRED: Path to MOBIDIC simulation configuration
# [path to .yaml file, e.g.: Arno.yaml]
mobidic_config: "Arno.yaml"


######## SIMULATION PERIOD

# REQUIRED for sequential DA: the window split into assimilation cycles.
# Cycle c runs [t_c, t_{c+1} - dt] inclusive, so every forcing timestep is used
# exactly once.
# [Format: "YYYY-MM-DD HH:MM:SS"]
simulation_period:
  start_date: "2023-11-02 00:00:00"
  end_date: "2023-11-04 23:45:00"

# OPTIONAL: If true, the meteorological raster is produced on the first run and reused in subsequent runs.
# [boolean, default: false]
use_raster_forcing: true


######## DATA ASSIMILATION CONFIGURATION

da:
  # OPTIONAL: 'sequential' (cycle-based) or 'batch' (no cycles; PESTPP-DA then
  # behaves like PESTPP-IES).
  # [batch | sequential, default: sequential]
  mode: sequential

  # REQUIRED (in sequential mode): cycle length.
  # Must be a multiple of simulation.timestep in the MOBIDIC config.
  # [e.g. "6h", "24h"]
  cycle_length: "6h"

  # REQUIRED when states.restart_from='warmup': warm-up run period.
  # [Format: "YYYY-MM-DD HH:MM:SS"]
  warmup_period:
    start_date: "2023-10-31 00:15:00"
    end_date: "2023-11-02 00:00:00"

  # OPTIONAL: which timesteps of a cycle carry a non-zero weight.
  # 'end': only the last timestep of a cycle is assimilated; 
  # 'all': uses every timestep of the cycle.
  # [end | all, default: all]
  assimilate: all

  # OPTIONAL: cycles with zero weight for forecasts
  # [non-negative integer, default: 0]
  forecast_cycles: 0

  # OPTIONAL: cycle number from which to (re)start from / last cycle to process.
  # [non-negative integers, default: null = all cycles]
  # hotstart_cycle: 0

  # OPTIONAL: cycle number to stop after (inclusive). 
  # If null, runs until the end of the simulation period.
  # [non-negative integer, default: null]
  stop_cycle: 4

  states:
    # OPTIONAL: how each cycle obtains its initial state.
    # [warmup | previous_cycle, default: warmup]
    restart_from: previous_cycle

    # --- the settings below apply only when restart_from='previous_cycle' ---
    # OPTIONAL: directory holding the state files, relative to working_dir.
    # [string, default: "da_states"]
    state_file_dir: "da_states"

    # OPTIONAL: past cycles of state files to keep on disk.
    # [integer >= 2, default: 2]
    keep_cycles: 4

    # --- joint state-parameter estimation  ---
    # OPTIONAL: state variables the filter adjusts alongside the parameters.
    # Empty (the default): states are transferred from cycle to cycle but never adjusted.
    # [list of: discharge, soil_moisture, soil_capillary, soil_gravitational,
    #  surface_water, runoff_fraction, conductivity. Default: [] = no state estimation]
    estimate: [conductivity]

    # OPTIONAL: which reaches are parametrized.
    # [upstream | all, default: upstream]
    estimate_reaches: upstream

    # --- soil-moisture zones (used only when `estimate` includes a soil store) ---

    # OPTIONAL: spatial aggregation into zones (i.e., the hillslopes associated with each reach).
    # [reach, default: reach]
    zones: reach

    # OPTIONAL: zones smaller than this are merged 
    # [integer >= 1, default: 1 = no merging]
    min_zone_cells: 10

    # OPTIONAL: bounds and cycle-0 prior spread of the soil moisture states.
    # [defaults: [0.0, 1.0] and 0.05]
    # saturation_bounds: [0.0, 1.0]
    saturation_prior_std: 0.10

    # OPTIONAL: floor on the cycle-0 prior spread of the surface-water state.
    # [number > 0, default: 1.0e-4]
    # surface_prior_std_floor: 1.0e-4

    # OPTIONAL: upper bound of a discharge state, as a multiple of the largest
    # discharge that reach reaches in a reference run.
    # [number > 1, default: 10.0]
    bound_factor: 10.0

    # OPTIONAL: cycle-0 prior standard deviation of each state, relative to its
    # warm-up value.
    # [number > 0, defaults: 0.1 and 1.0e-3]
    prior_std: 0.1
    prior_std_floor: 1.0e-3

    # OPTIONAL: lower bound of a discharge state [m3/s]. 
    # [number > 0, default: 1.0e-30]
    state_floor: 1.0e-30

    # OPTIONAL: localization of the ensemble update. 'upstream' writes loc.mat
    # (a PEST ASCII matrix) allowing each observation group to update only the
    # discharge states of the reaches draining into it, plus every non-state
    # parameter, and registers it as da_localizer.
    # [upstream | none, default: upstream]
    localizer: upstream


######## CALIBRATION PARAMETERS

# Static parameters. PESTPP-DA re-optimizes them at every cycle, so their
# estimated value changes as cycles progress.
parameters:
  # - name: alpha
  #   parameter_key: parameters.soil.alpha
  #   initial_value: 8.0e-06
  #   lower_bound: 1.0e-08
