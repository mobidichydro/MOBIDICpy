######## PEST++ SETTINGS

# REQUIRED for this file: PESTPP-DA.
pest_tool: da

pest_options:
  # ---- Common ----
  noptmax: 3       # Iterations per cycle. 0 = one run per cycle at the control-file
                   # values (state transfer only); -1 = prior Monte Carlo per cycle.
                   # Both are cheap first checks.
  pst_version: 2   # Forced to 2 in sequential mode: the 'cycle' and
                   # 'state_par_link' columns only exist in version-2 external files.

  # ---- Ensemble (all ies_* options are accepted; da_* variants take precedence) ----
  ies_num_reals: 40        # Number of realizations
  # ies_subset_size: 4     # Realizations used to test lambdas each iteration
  # ies_bad_phi: 1.0e+30   # Phi above which a realization is dropped
  ies_no_noise: false      # Do not use noise realisations to compute the ensemble update
  #ies_use_mda: true        # NOPTMAX = 1 and ies_use_mda(true) results in the standard ensemble smoother Kalman update

  # ---- DA (pest_tool: da) ----
  # da_hotstart_cycle: 0          # Cycle to (re)start from (also `mobidic calibration --hotstart-cycle N`)
  # da_stop_cycle: 15             # Last cycle to process
  # da_use_simulated_states: true # Use simulated final states as next-cycle initial states
  # da_noptmax_schedule: "sched.csv"  # Two-column file: cycle -> noptmax
  # debug_parse_only: true        # Validate the cycle interface and exit
  # check_tplins: false           # Disable interface checking for very large problems


######## WORKING DIRECTORY

working_dir: "pest_run_da"


######## PARALLEL EXECUTION

parallel:
  num_workers: 8
  port: 4004
  manager_ip: null
